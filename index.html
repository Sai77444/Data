<style>
:root{--bg:#0b0f14;--panel:#171d25;--line:#2a333e;--text:#eef4fb;--muted:#9aa9bb;--blue:#2997ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
.topbar{height:5px;background:linear-gradient(90deg,#168cff,#48d6b0,#168cff)}
.wrap{max-width:1120px;margin:0 auto;padding:54px 26px 30px}
h1{font-family:Consolas,monospace;font-size:clamp(27px,4vw,39px);margin:0 0 12px}
.subtitle{color:#b7c5d6;font-family:Consolas,monospace;font-size:15px;line-height:1.7;margin:0 0 28px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 22px;flex-wrap:wrap}
.search{flex:1;min-width:220px;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);outline:none;font-size:14px}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #168cff22}.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.card{background:var(--panel);border:1px solid #303943;border-radius:12px;min-height:125px;padding:17px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:inherit}
.card:hover{transform:translateY(-3px);border-color:#268df0;box-shadow:0 10px 28px #0005;background:#1b2530}
.tag{font-family:Consolas,monospace;font-size:12px;color:#2699ff;margin-bottom:10px}
.card-title{font-family:Consolas,monospace;font-size:15px;line-height:1.5;color:#f0f5fc}
.card-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
footer{margin-top:70px;color:#8295aa;font-size:13px;line-height:1.8}
.overlay{position:fixed;inset:0;background:#02060bd9;display:none;align-items:center;justify-content:center;padding:22px;z-index:10}
.overlay.open{display:flex}.modal{width:min(920px,100%);max-height:90vh;background:#101720;border:1px solid #344150;border-radius:16px;box-shadow:0 24px 90px #000b;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.modal-head h2{margin:0;font-size:19px;line-height:1.4}.modal-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.close{border:0;background:#25303c;color:#eaf2fa;border-radius:8px;width:36px;height:36px;font-size:23px;cursor:pointer}
.modal-tools{padding:13px 20px;display:flex;justify-content:flex-end;border-bottom:1px solid var(--line)}
.copy{background:#0879e8;border:0;color:white;border-radius:8px;padding:10px 16px;font-weight:650;cursor:pointer}.copy:hover{background:#2495ff}.copy.copied{background:#13875e}
.code-wrap{padding:16px 20px 20px;overflow:auto}.code-label{font-size:12px;color:#94a8bd;margin:0 0 9px}
pre{margin:0;background:#080d12;border:1px solid #26313d;border-radius:10px;padding:18px;overflow:auto;color:#d6e4f2;font:13px/1.6 Consolas,Monaco,monospace;white-space:pre;tab-size:4}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#163b30;color:#bdf7df;padding:11px 17px;border:1px solid #267c5d;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.wrap{padding:35px 16px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px;min-height:135px}.card-title{font-size:13px}.modal-head{padding:15px}.modal-tools{padding:12px 15px}.code-wrap{padding:14px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>

<script>
const programs = [{"practical":1,"title":"Linear Search","description":"Search a student roll number using linear search.","code":"#include <stdio.h>\n\nvoid input(int a[], int n)\n{\n    int i;\n\n    printf(\"Enter roll numbers:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &a[i]);\n    }\n}\n\nvoid display(int a[], int n)\n{\n    int i;\n\n    printf(\"Roll numbers:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        printf(\"%d \", a[i]);\n    }\n}\n\nvoid search(int a[], int n)\n{\n    int key, i, found = 0;\n\n    printf(\"\\nEnter roll number to search: \");\n    scanf(\"%d\", &key);\n\n    for(i = 0; i < n; i++)\n    {\n        if(a[i] == key)\n        {\n            found = 1;\n            break;\n        }\n    }\n\n    if(found == 1)\n        printf(\"Student attended training\");\n    else\n        printf(\"Student not attended training\");\n}\n\nint main()\n{\n    int a[100], n, ch;\n\n    printf(\"Enter number of students: \");\n    scanf(\"%d\", &n);\n\n    if(n < 1 || n > 100)\n    {\n        printf(\"Invalid number of students\");\n        return 1;\n    }\n\n    input(a, n);\n\n    while(1)\n    {\n        printf(\"\\n\\n1. Display\");\n        printf(\"\\n2. Search\");\n        printf(\"\\n3. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                display(a, n);\n                break;\n\n            case 2:\n                search(a, n);\n                break;\n\n            case 3:\n                return 0;\n        }\n    }\n}"},{"practical":1,"title":"Binary Search","description":"Search a roll number in a sorted array using binary search.","code":"#include <stdio.h>\n\nvoid input(int a[], int n)\n{\n    int i;\n\n    printf(\"Enter roll numbers in sorted order:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &a[i]);\n    }\n}\n\nvoid display(int a[], int n)\n{\n    int i;\n\n    printf(\"Roll numbers:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        printf(\"%d \", a[i]);\n    }\n}\n\nvoid search(int a[], int n)\n{\n    int key, low = 0, high = n-1, mid;\n\n    printf(\"\\nEnter roll number to search: \");\n    scanf(\"%d\", &key);\n\n    while(low <= high)\n    {\n        mid = (low + high) / 2;\n\n        if(a[mid] == key)\n        {\n            printf(\"Student attended training\");\n            return;\n        }\n        else if(key < a[mid])\n        {\n            high = mid - 1;\n        }\n        else\n        {\n            low = mid + 1;\n        }\n    }\n\n    printf(\"Student not attended training\");\n}\n\nint main()\n{\n    int a[100], n, ch;\n\n    printf(\"Enter number of students: \");\n    scanf(\"%d\", &n);\n\n    if(n < 1 || n > 100)\n    {\n        printf(\"Invalid number of students\");\n        return 1;\n    }\n\n    input(a, n);\n\n    while(1)\n    {\n        printf(\"\\n\\n1. Display\");\n        printf(\"\\n2. Search\");\n        printf(\"\\n3. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                display(a, n);\n                break;\n\n            case 2:\n                search(a, n);\n                break;\n\n            case 3:\n                return 0;\n        }\n    }\n}"},{"practical":2,"title":"Selection Sort","description":"Sort student percentages and display the top five scores.","code":"#include <stdio.h>\n\nvoid selectionSort(float a[], int n)\n{\n    int i, j, min;\n    float temp;\n\n    for(i = 0; i < n-1; i++)\n    {\n        min = i;\n\n        for(j = i+1; j < n; j++)\n        {\n            if(a[j] < a[min])\n                min = j;\n        }\n\n        temp = a[i];\n        a[i] = a[min];\n        a[min] = temp;\n    }\n}\n\nint main()\n{\n    int n, i;\n    float a[100];\n\n    printf(\"Enter number of students: \");\n    scanf(\"%d\", &n);\n\n    if(n < 1 || n > 100)\n    {\n        printf(\"Invalid number of students\");\n        return 1;\n    }\n\n    printf(\"Enter student percentages:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        scanf(\"%f\", &a[i]);\n    }\n\n    selectionSort(a, n);\n\n    printf(\"\\nSorted percentages:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        printf(\"%.2f \", a[i]);\n    }\n\n    printf(\"\\n\\nTop Five Scores:\\n\");\n\n    for(i = n-1; i >= 0 && i >= n-5; i--)\n    {\n        printf(\"%.2f\\n\", a[i]);\n    }\n\n    return 0;\n}"},{"practical":3,"title":"Hash Table — Linear Probing","description":"Insert, search and display phone numbers using linear probing.","code":"#include <stdio.h>\n#define SIZE 11\n\nint table[SIZE];\n\nvoid insert()\n{\n    int key, index, i;\n\n    printf(\"Enter phone number: \");\n    scanf(\"%d\", &key);\n\n    if(key <= 0)\n    {\n        printf(\"Enter a positive phone number\");\n        return;\n    }\n\n    for(i = 0; i < SIZE; i++)\n    {\n        index = (key % SIZE + i) % SIZE;\n\n        if(table[index] == 0)\n        {\n            table[index] = key;\n            printf(\"Phone number inserted\");\n            return;\n        }\n    }\n\n    printf(\"Hash table is full\");\n}\n\nvoid search()\n{\n    int key, index, i;\n\n    printf(\"Enter phone number: \");\n    scanf(\"%d\", &key);\n\n    if(key <= 0)\n    {\n        printf(\"Enter a positive phone number\");\n        return;\n    }\n\n    for(i = 0; i < SIZE; i++)\n    {\n        index = (key % SIZE + i) % SIZE;\n\n        if(table[index] == key)\n        {\n            printf(\"Phone number found at index %d\", index);\n            return;\n        }\n    }\n\n    printf(\"Phone number not found\");\n}\n\nvoid display()\n{\n    int i;\n\n    printf(\"\\nIndex\\tPhone Number\\n\");\n\n    for(i = 0; i < SIZE; i++)\n    {\n        printf(\"%d\\t%d\\n\", i, table[i]);\n    }\n}\n\nint main()\n{\n    int ch = 0;\n\n    while(ch != 4)\n    {\n        printf(\"\\n\\n1. Insert\");\n        printf(\"\\n2. Search\");\n        printf(\"\\n3. Display\");\n        printf(\"\\n4. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                insert();\n                break;\n\n            case 2:\n                search();\n                break;\n\n            case 3:\n                display();\n                break;\n\n            case 4:\n                printf(\"Program terminated\");\n                break;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n\n    return 0;\n}"},{"practical":3,"title":"Hash Table — Double Hashing","description":"Resolve hash collisions using double hashing.","code":"#include <stdio.h>\n#define SIZE 11\n\nint table[SIZE];\n\nvoid insert()\n{\n    int key, index, i;\n\n    printf(\"Enter phone number: \");\n    scanf(\"%d\", &key);\n\n    if(key <= 0)\n    {\n        printf(\"Enter a positive phone number\");\n        return;\n    }\n\n    for(i = 0; i < SIZE; i++)\n    {\n        index = (key % SIZE + i * (7 - key % 7)) % SIZE;\n\n        if(table[index] == 0)\n        {\n            table[index] = key;\n            printf(\"Phone number inserted\");\n            return;\n        }\n    }\n\n    printf(\"Hash table is full\");\n}\n\nvoid search()\n{\n    int key, index, i;\n\n    printf(\"Enter phone number: \");\n    scanf(\"%d\", &key);\n\n    if(key <= 0)\n    {\n        printf(\"Enter a positive phone number\");\n        return;\n    }\n\n    for(i = 0; i < SIZE; i++)\n    {\n        index = (key % SIZE + i * (7 - key % 7)) % SIZE;\n\n        if(table[index] == key)\n        {\n            printf(\"Phone number found at index %d\", index);\n            return;\n        }\n\n        if(table[index] == 0)\n            break;\n    }\n\n    printf(\"Phone number not found\");\n}\n\nvoid display()\n{\n    int i;\n\n    printf(\"\\nIndex\\tPhone Number\\n\");\n\n    for(i = 0; i < SIZE; i++)\n    {\n        printf(\"%d\\t%d\\n\", i, table[i]);\n    }\n}\n\nint main()\n{\n    int ch = 0;\n\n    while(ch != 4)\n    {\n        printf(\"\\n\\n1. Insert\");\n        printf(\"\\n2. Search\");\n        printf(\"\\n3. Display\");\n        printf(\"\\n4. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                insert();\n                break;\n\n            case 2:\n                search();\n                break;\n\n            case 3:\n                display();\n                break;\n\n            case 4:\n                printf(\"Program terminated\");\n                break;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n\n    return 0;\n}"},{"practical":3,"title":"Hash Table — Quadratic Probing","description":"Resolve hash collisions using quadratic probing.","code":"#include <stdio.h>\n#define SIZE 11\n\nint table[SIZE];\n\nvoid insert()\n{\n    int key, index, i;\n\n    printf(\"Enter phone number: \");\n    scanf(\"%d\", &key);\n\n    if(key <= 0)\n    {\n        printf(\"Enter a positive phone number\");\n        return;\n    }\n\n    for(i = 0; i < SIZE; i++)\n    {\n        index = (key % SIZE + i * i) % SIZE;\n\n        if(table[index] == 0)\n        {\n            table[index] = key;\n            printf(\"Phone number inserted\");\n            return;\n        }\n    }\n\n    printf(\"Hash table is full\");\n}\n\nvoid search()\n{\n    int key, index, i;\n\n    printf(\"Enter phone number: \");\n    scanf(\"%d\", &key);\n\n    if(key <= 0)\n    {\n        printf(\"Enter a positive phone number\");\n        return;\n    }\n\n    for(i = 0; i < SIZE; i++)\n    {\n        index = (key % SIZE + i * i) % SIZE;\n\n        if(table[index] == key)\n        {\n            printf(\"Phone number found at index %d\", index);\n            return;\n        }\n\n        if(table[index] == 0)\n            break;\n    }\n\n    printf(\"Phone number not found\");\n}\n\nvoid display()\n{\n    int i;\n\n    printf(\"\\nIndex\\tPhone Number\\n\");\n\n    for(i = 0; i < SIZE; i++)\n    {\n        printf(\"%d\\t%d\\n\", i, table[i]);\n    }\n}\n\nint main()\n{\n    int ch = 0;\n\n    while(ch != 4)\n    {\n        printf(\"\\n\\n1. Insert\");\n        printf(\"\\n2. Search\");\n        printf(\"\\n3. Display\");\n        printf(\"\\n4. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                insert();\n                break;\n\n            case 2:\n                search();\n                break;\n\n            case 3:\n                display();\n                break;\n\n            case 4:\n                printf(\"Program terminated\");\n                break;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n\n    return 0;\n}"},{"practical":4,"title":"Pinnacle Club — Singly Linked List","description":"Manage club members using a singly linked list.","code":"#include <stdio.h>\n#include <stdlib.h>\n\nstruct node\n{\n    int prn;\n    char name[30];\n    struct node *next;\n};\n\nstruct node *head = NULL;\n\nvoid addPresident()\n{\n    struct node *newnode;\n\n    newnode = (struct node*)malloc(sizeof(struct node));\n\n    printf(\"Enter PRN and Name: \");\n    scanf(\"%d %s\", &newnode->prn, newnode->name);\n\n    newnode->next = head;\n    head = newnode;\n\n    printf(\"President added\");\n}\n\nvoid addSecretary()\n{\n    struct node *newnode, *temp;\n\n    newnode = (struct node*)malloc(sizeof(struct node));\n\n    printf(\"Enter PRN and Name: \");\n    scanf(\"%d %s\", &newnode->prn, newnode->name);\n\n    newnode->next = NULL;\n\n    if(head == NULL)\n        head = newnode;\n    else\n    {\n        temp = head;\n\n        while(temp->next != NULL)\n            temp = temp->next;\n\n        temp->next = newnode;\n    }\n\n    printf(\"Secretary added\");\n}\n\nvoid addMember()\n{\n    struct node *newnode, *temp;\n\n    if(head == NULL)\n    {\n        printf(\"Add president first\");\n        return;\n    }\n\n    newnode = (struct node*)malloc(sizeof(struct node));\n\n    printf(\"Enter PRN and Name: \");\n    scanf(\"%d %s\", &newnode->prn, newnode->name);\n\n    temp = head;\n\n    while(temp->next != NULL)\n        temp = temp->next;\n\n    temp->next = newnode;\n    newnode->next = NULL;\n\n    printf(\"Member added\");\n}\n\nvoid deleteMember()\n{\n    struct node *temp, *prev;\n    int key;\n\n    printf(\"Enter PRN to delete: \");\n    scanf(\"%d\", &key);\n\n    temp = head;\n    prev = NULL;\n\n    while(temp != NULL && temp->prn != key)\n    {\n        prev = temp;\n        temp = temp->next;\n    }\n\n    if(temp == NULL)\n    {\n        printf(\"Member not found\");\n        return;\n    }\n\n    if(prev == NULL)\n        head = temp->next;\n    else\n        prev->next = temp->next;\n\n    free(temp);\n\n    printf(\"Member deleted\");\n}\n\nvoid count()\n{\n    struct node *temp = head;\n    int total = 0;\n\n    while(temp != NULL)\n    {\n        total++;\n        temp = temp->next;\n    }\n\n    printf(\"Total members = %d\", total);\n}\n\nvoid display()\n{\n    struct node *temp = head;\n\n    if(head == NULL)\n    {\n        printf(\"Club is empty\");\n        return;\n    }\n\n    printf(\"\\nClub Members:\\n\");\n\n    while(temp != NULL)\n    {\n        printf(\"\\nPRN: %d  Name: %s\", temp->prn, temp->name);\n        temp = temp->next;\n    }\n}\n\nint main()\n{\n    int ch = 0;\n\n    while(ch != 7)\n    {\n        printf(\"\\n\\n1. Add President\");\n        printf(\"\\n2. Add Member\");\n        printf(\"\\n3. Add Secretary\");\n        printf(\"\\n4. Delete Member\");\n        printf(\"\\n5. Count Members\");\n        printf(\"\\n6. Display Members\");\n        printf(\"\\n7. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                addPresident();\n                break;\n\n            case 2:\n                addMember();\n                break;\n\n            case 3:\n                addSecretary();\n                break;\n\n            case 4:\n                deleteMember();\n                break;\n\n            case 5:\n                count();\n                break;\n\n            case 6:\n                display();\n                break;\n\n            case 7:\n                printf(\"Program terminated\");\n                break;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n\n    return 0;\n}"},{"practical":5,"title":"Cinemax Booking — Doubly Linked List","description":"Manage available seats, bookings and cancellations.","code":"#include <stdio.h>\n#include <stdlib.h>\n\nstruct node\n{\n    int seat;\n    struct node *prev, *next;\n};\n\nstruct node *head[10];\n\nvoid initialize()\n{\n    int i, j;\n\n    for(i = 0; i < 10; i++)\n    {\n        head[i] = NULL;\n\n        for(j = 7; j >= 1; j--)\n        {\n            struct node *newnode;\n\n            newnode = (struct node*)malloc(sizeof(struct node));\n\n            newnode->seat = j;\n            newnode->prev = NULL;\n            newnode->next = head[i];\n\n            if(head[i] != NULL)\n                head[i]->prev = newnode;\n\n            head[i] = newnode;\n        }\n    }\n\n    /* Random bookings */\n    /* Row 1 seat 3 */\n    /* Row 2 seat 5 */\n    /* Row 3 seat 2 */\n\n    /* Remove these seats from available list */\n    /* Using deleteSeat function after initialization */\n}\n\nvoid deleteSeat(int r, int s)\n{\n    struct node *temp = head[r];\n\n    while(temp != NULL && temp->seat != s)\n        temp = temp->next;\n\n    if(temp == NULL)\n        return;\n\n    if(temp->prev == NULL)\n        head[r] = temp->next;\n    else\n        temp->prev->next = temp->next;\n\n    if(temp->next != NULL)\n        temp->next->prev = temp->prev;\n\n    free(temp);\n}\n\nvoid addSeat(int r, int s)\n{\n    struct node *newnode, *temp;\n\n    newnode = (struct node*)malloc(sizeof(struct node));\n\n    newnode->seat = s;\n    newnode->prev = NULL;\n    newnode->next = NULL;\n\n    if(head[r] == NULL)\n    {\n        head[r] = newnode;\n        return;\n    }\n\n    if(s < head[r]->seat)\n    {\n        newnode->next = head[r];\n        head[r]->prev = newnode;\n        head[r] = newnode;\n        return;\n    }\n\n    temp = head[r];\n\n    while(temp->next != NULL && temp->next->seat < s)\n        temp = temp->next;\n\n    newnode->next = temp->next;\n    newnode->prev = temp;\n\n    if(temp->next != NULL)\n        temp->next->prev = newnode;\n\n    temp->next = newnode;\n}\n\nvoid display()\n{\n    int i;\n    struct node *temp;\n\n    for(i = 0; i < 10; i++)\n    {\n        printf(\"\\nRow %d: \", i+1);\n\n        temp = head[i];\n\n        while(temp != NULL)\n        {\n            printf(\"%d \", temp->seat);\n            temp = temp->next;\n        }\n    }\n}\n\nvoid book()\n{\n    int r, s;\n    struct node *temp;\n\n    printf(\"Enter row and seat number: \");\n    scanf(\"%d%d\", &r, &s);\n\n    if(r < 1 || r > 10 || s < 1 || s > 7)\n    {\n        printf(\"Invalid seat\");\n        return;\n    }\n\n    temp = head[r-1];\n\n    while(temp != NULL && temp->seat != s)\n        temp = temp->next;\n\n    if(temp == NULL)\n        printf(\"Seat already booked\");\n    else\n    {\n        deleteSeat(r-1, s);\n        printf(\"Seat booked successfully\");\n    }\n}\n\nvoid cancel()\n{\n    int r, s;\n    struct node *temp;\n\n    printf(\"Enter row and seat number: \");\n    scanf(\"%d%d\", &r, &s);\n\n    if(r < 1 || r > 10 || s < 1 || s > 7)\n    {\n        printf(\"Invalid seat\");\n        return;\n    }\n\n    temp = head[r-1];\n\n    while(temp != NULL && temp->seat != s)\n        temp = temp->next;\n\n    if(temp != NULL)\n        printf(\"Seat is already available\");\n    else\n    {\n        addSeat(r-1, s);\n        printf(\"Booking cancelled\");\n    }\n}\n\nint main()\n{\n    int ch = 0;\n\n    initialize();\n\n    deleteSeat(0, 3);\n    deleteSeat(1, 5);\n    deleteSeat(2, 2);\n\n    while(ch != 4)\n    {\n        printf(\"\\n\\n1. Display Available Seats\");\n        printf(\"\\n2. Book Seat\");\n        printf(\"\\n3. Cancel Booking\");\n        printf(\"\\n4. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                display();\n                break;\n\n            case 2:\n                book();\n                break;\n\n            case 3:\n                cancel();\n                break;\n\n            case 4:\n                printf(\"Program terminated\");\n                break;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n\n    return 0;\n}"},{"practical":6,"title":"Balanced Parentheses — Stack","description":"Check whether brackets in an expression are balanced.","code":"#include <stdio.h>\n#include <string.h>\n\nchar stack[100];\nint top = -1;\n\nvoid push(char ch)\n{\n    top++;\n    stack[top] = ch;\n}\n\nvoid pop()\n{\n    top--;\n}\n\nvoid check(char exp[])\n{\n    int i;\n\n    char ch;\n\n    top = -1;\n\n    for(i = 0; exp[i] != '\\0'; i++)\n    {\n        ch = exp[i];\n\n        if(ch == '(' || ch == '{' || ch == '[')\n        {\n            if(top >= 98)\n            {\n                printf(\"Expression is too long\");\n                return;\n            }\n            push(ch);\n        }\n        else if(ch == ')' || ch == '}' || ch == ']')\n        {\n            if(top == -1)\n            {\n                printf(\"Expression is not balanced\");\n                return;\n            }\n\n            if((ch == ')' && stack[top] == '(') ||\n               (ch == '}' && stack[top] == '{') ||\n               (ch == ']' && stack[top] == '['))\n            {\n                pop();\n            }\n            else\n            {\n                printf(\"Expression is not balanced\");\n                return;\n            }\n        }\n    }\n\n    if(top == -1)\n        printf(\"Expression is balanced\");\n    else\n        printf(\"Expression is not balanced\");\n}\n\nint main()\n{\n    char exp[100];\n\n    printf(\"Enter expression: \");\n    scanf(\"%s\", exp);\n\n    check(exp);\n\n    return 0;\n}\n\n/* Practical 7: Simulating a Job Queue Using Queue */"},{"practical":7,"title":"Job Queue — Queue","description":"Add, process and display jobs using a queue.","code":"#include <stdio.h>\n#define MAX 10\n\nint queue[MAX];\nint front = 0, rear = -1, count = 0;\n\nint isFull(void)\n{\n    return count == MAX;\n}\n\nint isEmpty(void)\n{\n    return count == 0;\n}\n\nvoid addJob(int jobId)\n{\n    if(isFull())\n    {\n        printf(\"Queue Overflow. Cannot add job %d\\n\", jobId);\n        return;\n    }\n\n    rear = (rear + 1) % MAX;\n    queue[rear] = jobId;\n    count++;\n\n    printf(\"Job %d added to the queue.\\n\", jobId);\n}\n\nvoid deleteJob(void)\n{\n    int jobId;\n\n    if(isEmpty())\n    {\n        printf(\"Queue Underflow. No job to process.\\n\");\n        return;\n    }\n\n    jobId = queue[front];\n    front = (front + 1) % MAX;\n    count--;\n\n    printf(\"Job %d processed and removed from the queue.\\n\", jobId);\n}\n\nvoid displayQueue(void)\n{\n    int i, index;\n\n    if(isEmpty())\n    {\n        printf(\"Job queue is empty.\\n\");\n        return;\n    }\n\n    printf(\"Jobs in queue (front to rear): \");\n\n    for(i = 0; i < count; i++)\n    {\n        index = (front + i) % MAX;\n        printf(\"%d \", queue[index]);\n    }\n\n    printf(\"\\n\");\n}\n\nint main(void)\n{\n    int choice, jobId;\n\n    do\n    {\n        printf(\"\\n----- Job Queue MENU -----\\n\");\n        printf(\"1. Add Job\\n\");\n        printf(\"2. Process/Delete Job\\n\");\n        printf(\"3. Display Queue\\n\");\n        printf(\"4. Exit\\nChoice: \");\n        scanf(\"%d\", &choice);\n\n        switch(choice)\n        {\n            case 1:\n                printf(\"Enter Job ID: \");\n                scanf(\"%d\", &jobId);\n                addJob(jobId);\n                break;\n\n            case 2:\n                deleteJob();\n                break;\n\n            case 3:\n                displayQueue();\n                break;\n\n            case 4:\n                printf(\"Program terminated.\\n\");\n                break;\n\n            default:\n                printf(\"Invalid choice.\\n\");\n        }\n    } while(choice != 4);\n\n    return 0;\n}"},{"practical":8,"title":"BST — Height and Minimum","description":"Insert values, calculate tree height and find minimum value.","code":"#include <stdio.h>\n#include <stdlib.h>\n\nstruct node\n{\n    int data;\n    struct node *left, *right;\n};\n\nstruct node* insert(struct node *root, int value)\n{\n    if(root == NULL)\n    {\n        struct node *newnode;\n        newnode = (struct node*)malloc(sizeof(struct node));\n\n        if(newnode == NULL)\n        {\n            printf(\"Memory allocation failed\");\n            return NULL;\n        }\n\n        newnode->data = value;\n        newnode->left = NULL;\n        newnode->right = NULL;\n\n        return newnode;\n    }\n\n    if(value < root->data)\n        root->left = insert(root->left, value);\n    else\n        root->right = insert(root->right, value);\n\n    return root;\n}\n\nint height(struct node *root)\n{\n    int l, r;\n\n    if(root == NULL)\n        return 0;\n\n    l = height(root->left);\n    r = height(root->right);\n\n    if(l > r)\n        return l + 1;\n    else\n        return r + 1;\n}\n\nint minimum(struct node *root)\n{\n    if(root == NULL)\n        return -1;\n\n    while(root->left != NULL)\n        root = root->left;\n\n    return root->data;\n}\n\nvoid display(struct node *root)\n{\n    if(root != NULL)\n    {\n        display(root->left);\n        printf(\"%d \", root->data);\n        display(root->right);\n    }\n}\n\nint main()\n{\n    struct node *root = NULL;\n    int ch, value;\n\n    while(1)\n    {\n        printf(\"\\n\\n1. Insert\");\n        printf(\"\\n2. Longest Path\");\n        printf(\"\\n3. Minimum Value\");\n        printf(\"\\n4. Display\");\n        printf(\"\\n5. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                printf(\"Enter value: \");\n                scanf(\"%d\", &value);\n                root = insert(root, value);\n                break;\n\n            case 2:\n                printf(\"Longest path = %d nodes\", height(root));\n                break;\n\n            case 3:\n                if(root == NULL)\n                    printf(\"Tree is empty\");\n                else\n                    printf(\"Minimum value = %d\", minimum(root));\n                break;\n\n            case 4:\n                printf(\"BST: \");\n                display(root);\n                break;\n\n            case 5:\n                printf(\"Program terminated\");\n                return 0;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n}"},{"practical":9,"title":"Graph Connectivity — DFS","description":"Represent a graph with an adjacency matrix and check connectivity using DFS.","code":"#include <stdio.h>\n\nint graph[10][10], visited[10], n;\n\nvoid input()\n{\n    int i, j;\n\n    printf(\"Enter number of cities: \");\n    scanf(\"%d\", &n);\n\n    if(n < 1 || n > 10)\n    {\n        printf(\"Number of cities must be between 1 and 10\");\n        n = 0;\n        return;\n    }\n\n    printf(\"Enter adjacency matrix for an undirected graph:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        for(j = 0; j < n; j++)\n        {\n            scanf(\"%d\", &graph[i][j]);\n        }\n    }\n}\n\nvoid display()\n{\n    int i, j;\n\n    printf(\"\\nAdjacency Matrix:\\n\");\n\n    for(i = 0; i < n; i++)\n    {\n        for(j = 0; j < n; j++)\n        {\n            printf(\"%d \", graph[i][j]);\n        }\n        printf(\"\\n\");\n    }\n}\n\nvoid dfs(int v)\n{\n    int i;\n\n    visited[v] = 1;\n\n    for(i = 0; i < n; i++)\n    {\n        if(graph[v][i] != 0 && visited[i] == 0)\n        {\n            dfs(i);\n        }\n    }\n}\n\nvoid connected()\n{\n    int i, count = 0;\n\n    for(i = 0; i < n; i++)\n        visited[i] = 0;\n\n    dfs(0);\n\n    for(i = 0; i < n; i++)\n    {\n        if(visited[i] == 1)\n            count++;\n    }\n\n    if(count == n)\n        printf(\"Graph is connected\");\n    else\n        printf(\"Graph is not connected\");\n}\n\nint main()\n{\n    int ch;\n\n    input();\n    if(n == 0)\n        return 1;\n\n    while(1)\n    {\n        printf(\"\\n\\n1. Display Graph\");\n        printf(\"\\n2. Check Connectivity\");\n        printf(\"\\n3. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                display();\n                break;\n\n            case 2:\n                connected();\n                break;\n\n            case 3:\n                printf(\"Program terminated\");\n                return 0;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n}"},{"practical":8,"title":"BST — Mirror and Search","description":"Mirror a binary search tree and search for a value.","code":"#include <stdio.h>\n#include <stdlib.h>\n\nstruct node\n{\n    int data;\n    struct node *left, *right;\n};\n\nint mirrored = 0;\n\nstruct node* insert(struct node *root, int value)\n{\n    if(root == NULL)\n    {\n        struct node *newnode;\n        newnode = (struct node*)malloc(sizeof(struct node));\n\n        if(newnode == NULL)\n        {\n            printf(\"Memory allocation failed\");\n            return NULL;\n        }\n\n        newnode->data = value;\n        newnode->left = NULL;\n        newnode->right = NULL;\n\n        return newnode;\n    }\n\n    if((value < root->data && !mirrored) ||\n       (value > root->data && mirrored))\n        root->left = insert(root->left, value);\n    else\n        root->right = insert(root->right, value);\n\n    return root;\n}\n\nvoid mirror(struct node *root)\n{\n    struct node *temp;\n\n    if(root != NULL)\n    {\n        temp = root->left;\n        root->left = root->right;\n        root->right = temp;\n\n        mirror(root->left);\n        mirror(root->right);\n    }\n}\n\nint search(struct node *root, int key)\n{\n    if(root == NULL)\n        return 0;\n\n    if(root->data == key)\n        return 1;\n\n    return search(root->left, key) || search(root->right, key);\n}\n\nvoid display(struct node *root)\n{\n    if(root != NULL)\n    {\n        display(root->left);\n        printf(\"%d \", root->data);\n        display(root->right);\n    }\n}\n\nint main()\n{\n    struct node *root = NULL;\n    int ch, value;\n\n    while(1)\n    {\n        printf(\"\\n\\n1. Insert\");\n        printf(\"\\n2. Mirror Tree\");\n        printf(\"\\n3. Search\");\n        printf(\"\\n4. Display\");\n        printf(\"\\n5. Exit\");\n\n        printf(\"\\nEnter choice: \");\n        scanf(\"%d\", &ch);\n\n        switch(ch)\n        {\n            case 1:\n                printf(\"Enter value: \");\n                scanf(\"%d\", &value);\n                root = insert(root, value);\n                break;\n\n            case 2:\n                mirror(root);\n                mirrored = !mirrored;\n                printf(\"Tree mirrored\");\n                break;\n\n            case 3:\n                printf(\"Enter value to search: \");\n                scanf(\"%d\", &value);\n                if(search(root, value))\n                    printf(\"Value found\");\n                else\n                    printf(\"Value not found\");\n                break;\n\n            case 4:\n                printf(\"Tree: \");\n                display(root);\n                break;\n\n            case 5:\n                printf(\"Program terminated\");\n                return 0;\n\n            default:\n                printf(\"Invalid choice\");\n        }\n    }\n}"}];
const grid=document.getElementById('grid'),overlay=document.getElementById('overlay'),codeBox=document.getElementById('code'),copyBtn=document.getElementById('copyBtn');
let active=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(q=''){const f=programs.map((p,i)=>({...p,index:i})).filter(p=>(`${p.practical} ${p.title} ${p.description}`).toLowerCase().includes(q.trim().toLowerCase()));grid.innerHTML=f.map(p=>`<button class="card" type="button" data-index="${p.index}"><span class="tag">PROGRAM ${p.index+1} · PRACTICAL ${p.practical}</span><span class="card-title">${esc(p.title)}</span><span class="card-desc">${esc(p.description)}</span></button>`).join('');document.getElementById('count').textContent=`${f.length} of 13 programs`;}
async function copyProgramCode(text){
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const t=document.createElement('textarea');
      t.value=text;
      t.style.position='fixed';
      t.style.opacity='0';
      document.body.appendChild(t);
      t.focus();
      t.select();
      const ok=document.execCommand('copy');
      t.remove();
      if(!ok) throw new Error('Copy command was not successful');
    }
    return true;
  } catch(e) {
    // Keep the code visible in the modal if the browser blocks clipboard access.
    return false;
  }
}
async function openProgram(i){
  active=programs[i];
  document.getElementById('modalTitle').textContent=`Program ${i+1}: ${active.title}`;
  document.getElementById('modalDesc').textContent=`Practical ${active.practical} — ${active.description}`;
  codeBox.textContent=active.code;
  overlay.classList.add('open');

  const copied=await copyProgramCode(active.code);
  const toast=document.getElementById('toast');
  toast.textContent=copied ? `✓ ${active.title} copied automatically!` : 'Code is open below. Clipboard access was blocked by your browser.';
  toast.classList.add('show');
  setTimeout(()=>{toast.classList.remove('show');toast.textContent='Code copied to clipboard!';},2400);
}
copyBtn.addEventListener('click',async()=>{
  if(!active) return;
  const copied=await copyProgramCode(active.code);
  const toast=document.getElementById('toast');
  toast.textContent=copied ? 'Code copied to clipboard!' : 'Copy failed. Select the code and copy it manually.';
  toast.classList.add('show');
  copyBtn.textContent=copied ? 'Copied!' : 'Try Again';
  copyBtn.classList.toggle('copied',copied);
  setTimeout(()=>toast.classList.remove('show'),2400);
});

grid.addEventListener('click',e=>{
  const b=e.target.closest('.card');
  if(b) openProgram(Number(b.dataset.index));
});
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
document.getElementById('close').addEventListener('click',()=>overlay.classList.remove('open'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open');});
render();
</script>
</body></html>
